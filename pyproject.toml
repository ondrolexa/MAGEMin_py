[project]
name = "magemin"
version = "0.1.1"
description = "Python interface to MAGEMin, a C package that performs Gibbs energy minimization for thermodynamic equilibrium calculations."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Ondrej Lexa", email = "lexa.ondrej@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/ondrolexa/MAGEMin_py"
Repository = "https://github.com/ondrolexa/MAGEMin_py"
Issues = "https://github.com/ondrolexa/MAGEMin_py/issues"
Changelog = "https://github.com/ondrolexa/MAGEMin_py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
mesh = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
magemin-install = "magemin._download:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "magemin[plot,mesh]"]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build ignores .gitignore -- exclude build artifacts explicitly so a maintainer's locally
# built magemin_ext.o (from ./scripts/build_lib.sh) never leaks into a published sdist/wheel.
source-exclude = ["src/magemin/magemin_ext/*.o"]
wheel-exclude = ["src/magemin/magemin_ext/*.o"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
