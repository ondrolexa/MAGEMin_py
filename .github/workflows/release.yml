name: PyPi Publisher

on:
    release:
        types: [published]

jobs:
    tests:
        # The same lint/test/sanitizer/docs jobs that run on every push to main.
        uses: ./.github/workflows/tests.yml
        permissions:
            contents: read

    build:
        needs: tests
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: "3.14"

            - name: Check release tag matches package version
              run: |
                  version="$(uv version --short)"
                  tag="${GITHUB_REF_NAME#v}"
                  if [ "$tag" != "$version" ]; then
                      echo "::error::release tag $GITHUB_REF_NAME does not match package version $version"
                      exit 1
                  fi

            - name: Build package
              run: uv build

            - name: Upload distributions
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
                  if-no-files-found: error

    pypi-publisher:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/magemin

        permissions:
            id-token: write # mandatory for trusted publishing

        steps:
            - name: Download distributions
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Publish distribution 📦 to PyPI
              run: uv publish
