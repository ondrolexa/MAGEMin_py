name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml, so a release is only published after the full suite passes.
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install MAGEMin library
        # Prebuilt MAGEMin_jll binaries of the newest release: no compiler or system packages.
        # GITHUB_TOKEN lifts the GitHub API's unauthenticated rate limit.
        run: uv run magemin-install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q --deselect tests/test_download_live.py

  sanitizers:
    # libMAGEMin built from source with ASan/UBSan, with every allocation filled with
    # junk (malloc_fill_byte) so reads of uninitialized heap memory fail deterministically
    # instead of by luck.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y liblapacke-dev libnlopt-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Download MAGEMin source
        # The latest published release, matching the prebuilt binaries the test job uses.
        run: |
          ref="$(uv run python -c 'from magemin._download import resolve_ref; print(resolve_ref(None))')"
          mkdir -p "$RUNNER_TEMP/magemin"
          curl -fsSL "https://github.com/ComputationalThermodynamics/MAGEMin/archive/$ref.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/magemin"

      - name: Build sanitized library
        run: MAGEMIN_SRC_DIR="$RUNNER_TEMP/magemin" SANITIZE=1 ./scripts/build_lib.sh

      - name: Run tests under ASan/UBSan
        # Plotting tests excluded: matplotlib's own extensions don't run under a preloaded ASan.
        run: |
          MAGEMIN_LIB_PATH="$RUNNER_TEMP/magemin/libMAGEMin.so" \
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" PYTHONMALLOC=malloc \
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:malloc_fill_byte=190 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          .venv/bin/python -m pytest -q --deselect tests/test_download_live.py \
            --ignore=tests/test_diagrams_plot.py --ignore=tests/test_pseudosection_plot.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build docs
        run: uv run mkdocs build --strict
